build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - Composable

exceptions:
  TooGenericExceptionCaught:
    # Flagged sites are resilience boundaries that rethrow CancellationException first, then
    # surface anything else as a UI error instead of crashing the VPN runtime.
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true

complexity:
  CyclomaticComplexMethod:
    active: true
    # A flat `when` lookup measures data size, not logic complexity.
    ignoreSingleWhenExpression: true
  LongMethod:
    active: true
    threshold: 120
    # Test length is data volume, not branching complexity.
    excludes: ['**/src/test/**']
  LargeClass:
    active: true
    excludes: ['**/src/test/**']
  LongParameterList:
    active: true
    # Composables thread UI state and callbacks explicitly (no ambient DI into @Composable),
    # which legitimately reaches the low-to-mid teens.
    functionThreshold: 16
    constructorThreshold: 16
  TooManyFunctions:
    active: true
    thresholdInFiles: 40
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    thresholdInObjects: 25
    # Overridden members are imposed by the framework, not a cohesion choice.
    ignoreOverridden: true
    ignoreAnnotated: ['Dao']

formatting:
  active: true
  android: true
  # Only applied when the CLI also passes --auto-correct (detektFormat); the verification
  # `detekt` task never does, so it stays read-only there.
  autoCorrect: true
  MaximumLineLength:
    active: false
