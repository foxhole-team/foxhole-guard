MaintainerNotes: |-
  Build 90 mirrors the reviewer-owned reproducibility recipe. The signed 0.0.2
  APK was promoted unchanged from dev candidate 96e963f; release commit 798e58b
  has the identical Git tree d8461ad. Building the candidate commit preserves
  AGP's embedded VCS revision for verification. Rust and i2pd embed absolute
  paths, so the recipe reproduces the upstream runner's /home/runner layout and
  uses the pinned NDK 29. OpenSSL embeds its configure time, so
  SOURCE_DATE_EPOCH is pinned to the signed candidate's exact UTC build instant.
  The linker-generated i2pd build ID is normalized to the verified candidate's
  value; every other byte still has to match for F-Droid verification to pass.
  Build 117 needs no fixed runner path. Every network fetch happens in
  sudo:/prebuild:; the Gradle phase runs with
  foxhole.nativeOffline=true, which makes scripts/build-i2pd.sh and
  scripts/build-tor-transports.sh abort instead of downloading. prebuild: seeds
  three caches: Rust (cargo fetch --locked against FoxCore's Cargo.lock) and, via
  scripts/fetch-native-deps.sh, the OpenSSL/Boost source tarballs, the pinned Go
  toolchain and the lyrebird/conjure sources plus their Go module cache. Pins and
  sha256 digests live in scripts/native-deps.sh; the Go modules are verified by
  each upstream's go.sum, the transport sources by commit id.
  Build 117 uses the FoxHoleCore srclib and fails unless its HEAD exactly
  matches config/foxcore-revision.txt. It pins RUSTUP_TOOLCHAIN to the minimal
  Rust 1.97.1 toolchain and Android target; clippy and rustfmt are not needed by
  the APK build. FoxCore 0.0.4 remaps checkout, Cargo-home, and Rustup-home paths
  and rejects host paths in the built ELF. Current native scripts also remap i2pd
  paths and normalize native build IDs, so build 117 needs no fixed runner path.
  ndk: matches the ndkVersion pinned in app/build.gradle.kts and required by
  FoxCore's scripts/android-build.sh.
  foxhole.updateFloorVersionCode is deliberately unset. It means "the versionCode
  that supersedes this build", and F-Droid builds an entry once, while nothing
  supersedes it yet, and never rebuilds a published versionCode - so for the
  newest entry there is no correct value, and for an older one it can no longer
  be stamped. foxhole.updateSupportedUntilEpochDay is stampable here, but its
  value is a per-release support decision nothing in the tree carries; when it is
  used, note that AutoUpdateMode copies gradleprops verbatim, so a new entry must
  get a fresh horizon rather than inherit the previous one.
  The build is arm64-v8a only, matching the public upstream release.
  Build 117 uses the same ABI split and GitHub update channel as Binaries; changing
  either would prevent verification against the published upstream APK.
  AutoUpdateMode stays None because each app release needs a manually reviewed
  FoxHoleCore srclib revision and matching source-build inputs.

