Summary: Foxhole - 1.0.0-beta1 sing-box client
Description: |
  Foxhole is currently released as build version 1.0.0-beta1 for Android. It is
  a simple client for connecting to and managing sing-box profiles. It
  supports Tunnel and Proxy, as well as Split
  Tunnel for apps and sites and LAN Proxy. It supports profile import
  from files, the clipboard, QR codes, and HTTPS subscriptions,
  including compatible v2raytun-style subscriptions. TLS verification
  is strict by default; configs that require insecure TLS need explicit
  per-profile consent. No ads, analytics, or telemetry. It supports
  compatible configurations and its own smart config for deterministic
  Smart start with automatic VPN protocol selection.

  Key features:
  - Modes: Tunnel, Proxy
  - Split Tunnel for apps and sites
  - LAN Proxy over Wi-Fi for access from other devices
  - Proxy authentication
  - Site-based routing rules
  - Import from files, clipboard, QR codes, and HTTPS subscriptions
  - Supports Foxhole smart config with protocol selection and Smart start
    that ranks eligible options, tries the recommended protocol first,
    validates it, and falls back only after failure
  - Local traffic statistics
  - Subscription expiration date display
  - Encrypted local profile storage
  - No ads
  - No analytics
  - No telemetry

  Supported protocols:
  - VLESS
  - Trojan
  - Shadowsocks
  - VMess
  - Hysteria2
  - WireGuard
  - Outline

