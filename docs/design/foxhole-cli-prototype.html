<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>foxhole · cli</title>
<style>
  :root{
    --bg:        #0b0d12;
    --bg-raise:  #10131a;
    --bg-panel:  #12161f;
    --border:    #1e2430;
    --border-hi: #2a3242;
    --fg:        #cfd6e0;
    --fg-dim:    #6b7484;
    --fg-faint:  #454d5c;
    --accent:    #ff8a3d;
    --accent-dim:#ff8a3d55;
    --ok:        #3fcf8e;
    --warn:      #e5c07b;
    --err:       #f7768e;
    --sel:       #1a2030;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--mono);
    font-size:clamp(12.5px, 1.5vw, 14px);
    line-height:1.55;
    display:flex; flex-direction:column;
    height:100dvh;
    overflow:hidden;
  }
  ::selection{ background:var(--accent-dim); }

  /* ── header ─────────────────────────────────────────── */
  header{
    display:flex; align-items:center; gap:12px;
    padding:10px 16px;
    border-bottom:1px solid var(--border);
    background:var(--bg-raise);
    flex:none;
  }
  header .fox-mini{ width:30px; height:30px; image-rendering:pixelated; flex:none; }
  header .brand{ font-weight:700; letter-spacing:.28em; font-size:13px; }
  header .brand b{ color:var(--accent); font-weight:700; }
  header .ver{ color:var(--fg-faint); font-size:11px; letter-spacing:.08em; white-space:nowrap; }
  @media (max-width:720px){ header .ver{ display:none; } }
  header .spacer{ flex:1; }
  .statusline{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--fg-dim); white-space:nowrap;
    overflow:hidden;
  }
  .statusline .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--fg-faint); flex:none;
    transition:background .3s, box-shadow .3s;
  }
  .statusline.on  .dot{ background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .statusline.mid .dot{ background:var(--warn); box-shadow:0 0 8px var(--warn); animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{ opacity:.35; } }
  .statusline .sep{ color:var(--fg-faint); }
  .statusline .hl{ color:var(--fg); }

  /* ── route strip ────────────────────────────────────── */
  #routeStrip{
    flex:none;
    border-bottom:1px solid var(--border);
    background:var(--bg-panel);
    overflow-x:auto; overflow-y:hidden;
    max-height:0; opacity:0;
    transition:max-height .45s ease, opacity .45s ease;
  }
  #routeStrip.show{ max-height:96px; opacity:1; }
  .route-inner{
    display:flex; align-items:center; gap:0;
    padding:14px 20px; min-width:max-content;
  }
  .rnode{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 14px;
    border:1px solid var(--border-hi);
    border-radius:6px;
    background:var(--bg-raise);
    min-width:110px;
  }
  .rnode .t{ font-size:12px; color:var(--fg); white-space:nowrap; }
  .rnode .s{ font-size:10.5px; color:var(--fg-dim); white-space:nowrap; }
  .rnode.hot{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent-dim), 0 0 18px -6px var(--accent); }
  .rnode.hot .t{ color:var(--accent); }
  .rlink{
    position:relative;
    width:104px; height:2px; flex:none;
    background:repeating-linear-gradient(90deg,
      var(--accent) 0 6px, transparent 6px 12px);
    background-size:12px 2px;
    animation:flow .5s linear infinite;
    margin:0 2px;
  }
  @keyframes flow{ to{ background-position:12px 0; } }
  .rlink .lbl{
    position:absolute; left:50%; top:-16px; transform:translateX(-50%);
    font-size:10px; color:var(--fg-dim); white-space:nowrap;
  }
  .rlink .lbl.under{ top:auto; bottom:-16px; }

  /* ── terminal log ───────────────────────────────────── */
  main{
    flex:1; overflow-y:auto; overflow-x:hidden;
    padding:18px 18px 8px;
    scrollbar-width:thin; scrollbar-color:var(--border-hi) transparent;
  }
  main::-webkit-scrollbar{ width:8px; }
  main::-webkit-scrollbar-thumb{ background:var(--border-hi); border-radius:4px; }

  .line{ white-space:pre-wrap; word-break:break-word; min-height:1.55em; }
  .line.cmd .p{ color:var(--accent); font-weight:700; }
  .line.cmd .c{ color:var(--fg); }
  .dim{ color:var(--fg-dim); }
  .faint{ color:var(--fg-faint); }
  .ok{ color:var(--ok); }
  .warn{ color:var(--warn); }
  .err{ color:var(--err); }
  .acc{ color:var(--accent); }
  .white{ color:#e8edf4; }

  /* welcome banner */
  .banner{
    display:flex; align-items:center; gap:26px;
    border:1px solid var(--border);
    border-radius:8px;
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-raise));
    padding:20px 26px;
    margin:4px 0 18px;
    max-width:640px;
  }
  .banner canvas{ width:104px; height:104px; image-rendering:pixelated; flex:none;
    filter:drop-shadow(0 6px 24px var(--accent-dim)); }
  .banner .bw{ display:flex; flex-direction:column; gap:6px; }
  .banner .word{
    font-size:clamp(20px, 4vw, 28px); font-weight:700; letter-spacing:.34em; color:#e8edf4;
  }
  .banner .word b{ color:var(--accent); font-weight:700; text-shadow:0 0 22px var(--accent-dim); }
  .banner .tag{ color:var(--fg-dim); font-size:12px; }
  .banner .hint{ color:var(--fg-faint); font-size:12px; margin-top:6px; }
  .banner .hint kbd{
    border:1px solid var(--border-hi); border-bottom-width:2px; border-radius:4px;
    padding:0 6px; font-family:inherit; font-size:11px; color:var(--fg-dim);
    background:var(--bg-raise);
  }

  /* steps */
  .step{ display:flex; gap:10px; align-items:baseline; }
  .step .mark{ width:1.2em; flex:none; text-align:center; }
  .step .ms{ color:var(--fg-faint); margin-left:auto; padding-left:16px; }
  .steps-wrap{ max-width:560px; }

  /* status block */
  .kv{ display:grid; grid-template-columns:max-content 1fr; gap:2px 22px; max-width:560px; padding:2px 0 2px 2px; }
  .kv .k{ color:var(--fg-dim); }

  /* route block in log */
  .route-log{ padding:2px 0; white-space:pre; overflow-x:auto; }

  /* profiles picker */
  .plist{ max-width:620px; margin:2px 0; }
  .prow{
    display:flex; align-items:center; gap:12px;
    padding:3px 10px; border-radius:5px; cursor:pointer;
    border:1px solid transparent;
  }
  .prow:hover{ background:var(--sel); }
  .prow.active{ background:var(--sel); border-color:var(--border-hi); }
  .prow.active .name{ color:var(--accent); }
  .prow .idx{ color:var(--fg-faint); width:1.4em; }
  .prow .swatch{ width:9px; height:9px; border-radius:2px; flex:none; }
  .prow .name{ width:7.5em; color:var(--fg); }
  .prow .geo{ color:var(--fg-dim); flex:1; }
  .prow .ping{ color:var(--fg-dim); width:5em; text-align:right; }
  .prow .cur{ color:var(--ok); font-size:11px; }
  .plist.inert .prow{ cursor:default; opacity:.55; }
  .plist.inert .prow:hover{ background:transparent; }

  /* help table */
  .help{ display:grid; grid-template-columns:max-content 1fr; gap:1px 26px; max-width:620px; padding:2px 0; }
  .help .hc{ color:var(--accent); }

  /* ── input dock ─────────────────────────────────────── */
  #dock{ flex:none; border-top:1px solid var(--border); background:var(--bg-raise); }

  #suggest{
    display:none;
    border-bottom:1px solid var(--border);
    padding:6px 14px;
    background:var(--bg-panel);
  }
  #suggest.show{ display:block; }
  .sug{
    display:flex; gap:16px; align-items:baseline;
    padding:2px 8px; border-radius:4px; cursor:pointer;
  }
  .sug .n{ color:var(--fg); width:11em; }
  .sug .d{ color:var(--fg-dim); font-size:12px; }
  .sug.active{ background:var(--sel); }
  .sug.active .n{ color:var(--accent); }

  #chips{
    display:flex; gap:8px; flex-wrap:wrap;
    padding:0 14px;
    max-height:0; opacity:0; overflow:hidden;
    transition:max-height .3s ease, opacity .3s ease, padding .3s ease;
  }
  #chips.show{ max-height:80px; opacity:1; padding:10px 14px 2px; }
  .chip{
    border:1px solid var(--border-hi); border-radius:6px;
    background:var(--bg-panel); color:var(--fg-dim);
    padding:3px 12px; font-size:12px; cursor:pointer;
    transition:color .15s, border-color .15s;
    user-select:none;
  }
  .chip:hover{ color:var(--accent); border-color:var(--accent); }
  .chip.danger:hover{ color:var(--err); border-color:var(--err); }

  #inputRow{
    display:flex; align-items:center; gap:10px;
    padding:12px 16px 6px;
    cursor:text;
  }
  #inputRow .prompt{ color:var(--accent); font-weight:700; white-space:pre; }
  #inputRow .typed{ white-space:pre; }
  #inputRow .ghost{ color:var(--fg-faint); white-space:pre; }
  #cursor{
    display:inline-block; width:.62em; height:1.25em;
    background:var(--accent); vertical-align:text-bottom;
    animation:blink 1.1s steps(1) infinite;
  }
  body.unfocused #cursor{ animation:none; background:var(--fg-faint); }
  @keyframes blink{ 50%{ opacity:0; } }
  #hidden-input{
    position:absolute; opacity:0; pointer-events:none;
    width:1px; height:1px; left:-9999px;
  }
  #keyhints{
    display:flex; gap:18px; flex-wrap:wrap;
    padding:2px 16px 10px;
    font-size:11px; color:var(--fg-faint);
  }
  #keyhints b{ color:var(--fg-dim); font-weight:400; }

  @media (max-width:560px){
    #keyhints{ display:none; }
    .banner{ flex-direction:column; gap:14px; text-align:center; padding:18px; }
    .banner .bw{ align-items:center; }
    .prow .geo{ display:none; }
    .help{ grid-template-columns:1fr; }
    .help .hd{ margin-bottom:6px; color:var(--fg-dim); }
  }
</style>
</head>
<body>

<header>
  <canvas class="fox-mini" id="foxMini" width="16" height="16"></canvas>
  <div class="brand"><b>FOX</b>HOLE</div>
  <div class="ver">cli · v0.4.1</div>
  <div class="spacer"></div>
  <div class="statusline" id="statusline">
    <span class="dot"></span><span id="slText">offline</span>
  </div>
</header>

<div id="routeStrip"><div class="route-inner" id="routeInner"></div></div>

<main id="log"></main>

<div id="dock">
  <div id="suggest"></div>
  <div id="chips"></div>
  <div id="inputRow">
    <span class="prompt" id="promptEl">fox ❯</span>
    <span class="typed" id="typedEl"></span><span id="cursor"></span><span class="ghost" id="ghostEl"></span>
  </div>
  <div id="keyhints">
    <span><b>tab</b> дополнить</span>
    <span><b>enter</b> выполнить</span>
    <span><b>↑↓</b> история / выбор</span>
    <span><b>esc</b> очистить</span>
  </div>
  <input id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false">
</div>

<script>
/* ───────────────────────── data ───────────────────────── */

const PALETTES = {
  ember : { B:'#ff8a3d', D:'#c2571d', W:'#f6e8d9', E:'#20242e', N:'#2a2f3a', accent:'#ff8a3d' },
  arctic: { B:'#9fc6e0', D:'#6f92ab', W:'#eef4f8', E:'#1d232c', N:'#26303b', accent:'#7fb8dc' },
  sakura: { B:'#ff7d95', D:'#c74f66', W:'#ffe9ee', E:'#241f26', N:'#332a33', accent:'#ff7d95' },
  violet: { B:'#a789fa', D:'#7458c9', W:'#ece5fd', E:'#1f1c2b', N:'#2a2640', accent:'#a789fa' },
  sleep : { B:'#586170', D:'#414957', W:'#828b98', E:'#2a303b', N:'#333a46', accent:'#ff8a3d' },
};

const PROFILES = [
  { id:'auto',  city:'ближайший',  cc:'—',  ip:null,             ping:null, pal:'ember'  },
  { id:'ams-1', city:'amsterdam',  cc:'nl', ip:'203.0.113.12',  ping:12,   pal:'ember'  },
  { id:'osl-1', city:'oslo',       cc:'no', ip:'203.0.113.8',   ping:21,   pal:'arctic' },
  { id:'ber-1', city:'berlin',     cc:'de', ip:'203.0.113.201',   ping:17,   pal:'violet' },
  { id:'tok-1', city:'tokyo',      cc:'jp', ip:'203.0.113.44',   ping:84,   pal:'sakura' },
];

const COMMANDS = [
  { n:'connect',    a:'[профиль]', d:'подключиться к туннелю',       al:['c'] },
  { n:'disconnect', a:'',          d:'разорвать соединение',          al:['d'] },
  { n:'status',     a:'',          d:'состояние туннеля',             al:['s'] },
  { n:'profiles',   a:'',          d:'выбрать точку выхода',          al:['p'] },
  { n:'route',      a:'',          d:'показать маршрут трафика',      al:['r'] },
  { n:'help',       a:'',          d:'список команд',                 al:['?'] },
  { n:'clear',      a:'',          d:'очистить экран',                al:[]    },
];

const LOCAL_IP = '192.168.1.24';
const TUN_IP   = '10.8.0.7';

/* ───────────────────────── state ──────────────────────── */

const S = {
  mode:'offline',            // offline | connecting | connected
  profile: PROFILES[1],      // выбранный (ams-1 по умолчанию)
  since:0, ping:0, rx:0, tx:0,
  busy:false,
};

/* ─────────────────────── pixel fox ────────────────────── */

const SPRITE = [
  '.B............B.',
  '.BB..........BB.',
  '.BBD........DBB.',
  '.BBDD......DDBB.',
  '.BBBDD....DDBBB.',
  '.BBBBBB..BBBBBB.',
  '.BBBBBBBBBBBBBB.',
  'BBBBBBBBBBBBBBBB',
  'BBBEEBBBBBBEEBBB',
  'BWBBBBBBBBBBBBWB',
  '.WWBBBBBBBBBBWW.',
  '.WWWBBBBBBBBWWW.',
  '..WWWBBBBBBWWW..',
  '...WWWWWWWWWW...',
  '.....WWWWWW.....',
  '.......NN.......',
];

function drawFox(canvas, palName, opts={}){
  const pal = PALETTES[palName];
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,16,16);
  for(let y=0; y<SPRITE.length; y++){
    for(let x=0; x<16; x++){
      let ch = SPRITE[y][x];
      if(ch === '.') continue;
      if(ch === 'E' && (opts.blink || opts.sleep)){
        // закрытые глаза — тёмная чёрточка цветом тени
        ctx.fillStyle = pal.D;
        ctx.fillRect(x, y, 1, 1);
        continue;
      }
      ctx.fillStyle = pal[ch];
      ctx.fillRect(x, y, 1, 1);
    }
  }
}

const foxCanvases = [];           // {el, big}
function registerFox(el){ foxCanvases.push(el); repaintFoxes(); return el; }

let blinkOn = false;
function currentFoxPal(){
  if(S.mode === 'offline') return 'sleep';
  return S.profile.pal === undefined ? 'ember' : (S.profile.id==='auto' ? 'ember' : S.profile.pal);
}
function repaintFoxes(){
  const sleep = S.mode === 'offline';
  const pal = currentFoxPal();
  for(const c of foxCanvases){
    if(!c.isConnected) continue;
    drawFox(c, pal, { sleep, blink: blinkOn });
  }
}
// моргание
(function blinkLoop(){
  const delay = 2400 + Math.random()*2600;
  setTimeout(()=>{
    blinkOn = true; repaintFoxes();
    setTimeout(()=>{ blinkOn = false; repaintFoxes(); blinkLoop(); }, 130);
  }, delay);
})();

registerFox(document.getElementById('foxMini'));

/* ─────────────────────── helpers ──────────────────────── */

const log = document.getElementById('log');
const sleep = ms => new Promise(r=>setTimeout(r, ms));
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function push(html, cls=''){
  const el = document.createElement('div');
  el.className = 'line ' + cls;
  el.innerHTML = html;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function pushRaw(el){
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function blank(){ push('&nbsp;'); }

function setAccent(hex){
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent-dim', hex + '55');
}

function fmtBytes(b){
  if(b < 1024) return b.toFixed(0)+' B';
  if(b < 1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(2)+' MB';
}
function fmtUptime(){
  const s = Math.floor((Date.now()-S.since)/1000);
  const p = n => String(n).padStart(2,'0');
  return `${p(Math.floor(s/3600))}:${p(Math.floor(s/60)%60)}:${p(s%60)}`;
}

/* ─────────────────── statusline / route ───────────────── */

const slBox  = document.getElementById('statusline');
const slText = document.getElementById('slText');

function renderStatusline(){
  slBox.classList.toggle('on',  S.mode==='connected');
  slBox.classList.toggle('mid', S.mode==='connecting');
  if(S.mode==='offline'){ slText.innerHTML = '<span>offline</span>'; return; }
  if(S.mode==='connecting'){ slText.innerHTML = `<span class="warn">подключение…</span>`; return; }
  const narrow = window.innerWidth < 760;
  slText.innerHTML = narrow
    ? `<span class="hl">${S.profile.id}</span>`+
      `<span class="sep"> · </span>${fmtUptime()}`+
      `<span class="sep"> · </span>${S.ping}ms`
    : `<span class="hl">${S.profile.id}</span>`+
      `<span class="sep"> · </span>${S.profile.ip}`+
      `<span class="sep"> · </span>${fmtUptime()}`+
      `<span class="sep"> · </span>${S.ping}ms`+
      `<span class="sep"> · </span>↓${fmtBytes(S.rx)} ↑${fmtBytes(S.tx)}`;
}

const routeStrip = document.getElementById('routeStrip');
const routeInner = document.getElementById('routeInner');

function renderRouteStrip(){
  if(S.mode !== 'connected'){ routeStrip.classList.remove('show'); return; }
  const p = S.profile;
  routeInner.innerHTML = `
    <div class="rnode">
      <div class="t">вы</div><div class="s">${LOCAL_IP}</div>
    </div>
    <div class="rlink"><div class="lbl">fox0 · wireguard</div><div class="lbl under faint">encrypted</div></div>
    <div class="rnode hot">
      <div class="t">🦊 ${p.id}</div><div class="s">${p.city} · ${S.ping}ms</div>
    </div>
    <div class="rlink"><div class="lbl">exit</div></div>
    <div class="rnode">
      <div class="t">internet</div><div class="s">ваш ip: ${p.ip}</div>
    </div>`;
  routeStrip.classList.add('show');
}

setInterval(()=>{
  if(S.mode!=='connected') return;
  // живые метрики
  S.rx += 800 + Math.random()*42000;
  S.tx += 300 + Math.random()*9000;
  if(Math.random() < .35){
    S.ping = Math.max(3, Math.round(S.profile.ping + (Math.random()*6-3)));
    const s = routeInner.querySelector('.rnode.hot .s');
    if(s) s.textContent = `${S.profile.city} · ${S.ping}ms`;
  }
  renderStatusline();
}, 1000);

/* ─────────────────────── input line ───────────────────── */

const hidden  = document.getElementById('hidden-input');
const typedEl = document.getElementById('typedEl');
const ghostEl = document.getElementById('ghostEl');
const sugBox  = document.getElementById('suggest');
const chips   = document.getElementById('chips');

let typed = '';
let history = [], histIdx = -1;
let sugList = [], sugIdx = 0;
let picker = null;    // активный список профилей {rows, idx, el}

function profileMatches(tok){
  return PROFILES.filter(p => p.id.startsWith(tok) || p.city.startsWith(tok));
}

function computeSuggestions(){
  const t = typed.toLowerCase();
  if(t.includes(' ')){
    const [head, ...rest] = t.split(/\s+/);
    const tail = rest.join(' ');
    if(head==='connect' || head==='c'){
      return profileMatches(tail).map(p => ({
        full: head+' '+p.id,
        label: p.id,
        desc: p.id==='auto' ? 'самый быстрый узел' : `${p.city} · ${p.ping}ms`,
      }));
    }
    return [];
  }
  if(t === '') return [];
  const out = [];
  for(const c of COMMANDS){
    if(c.n.startsWith(t)) out.push({ full:c.n, label:c.n + (c.a?' '+c.a:''), desc:c.d });
    else if(c.al.includes(t)) out.push({ full:c.n, label:c.n, desc:c.d });
  }
  return out;
}

function renderInput(){
  typedEl.textContent = typed;
  sugList = computeSuggestions();
  if(sugIdx >= sugList.length) sugIdx = 0;

  // ghost — остаток активной подсказки
  let ghost = '';
  if(sugList.length && typed){
    const full = sugList[sugIdx].full;
    if(full.startsWith(typed.toLowerCase()) && full.length > typed.length)
      ghost = full.slice(typed.length);
  }
  ghostEl.textContent = ghost;

  // панель подсказок
  if(sugList.length && typed){
    sugBox.innerHTML = sugList.map((s,i)=>
      `<div class="sug ${i===sugIdx?'active':''}" data-i="${i}">
         <span class="n">${esc(s.label)}</span><span class="d">${esc(s.desc)}</span>
       </div>`).join('');
    sugBox.classList.add('show');
    sugBox.querySelectorAll('.sug').forEach(el=>{
      el.addEventListener('mousedown', e=>{
        e.preventDefault();
        typed = sugList[+el.dataset.i].full + ' ';
        typed = typed.trimEnd();
        submit();
      });
    });
  } else {
    sugBox.classList.remove('show');
  }
}

function acceptGhost(){
  if(sugList.length && ghostEl.textContent){
    typed = sugList[sugIdx].full;
    renderInput();
    return true;
  }
  return false;
}

function submit(){
  let text = typed.trim();
  // незавершённый однозначный префикс → дополняем
  if(text && sugList.length === 1 && ghostEl.textContent) text = sugList[0].full;
  typed = ''; sugIdx = 0; renderInput();
  if(!text) return;
  history.push(text); histIdx = history.length;
  exec(text);
}

/* канал ввода для мобилок/IME: символы, не перехваченные keydown, приходят сюда */
hidden.addEventListener('input', ()=>{
  if(!hidden.value) return;
  typed += hidden.value.toLowerCase();
  hidden.value = '';
  sugIdx = 0;
  renderInput();
});

document.addEventListener('keydown', e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;

  // навигация в пикере профилей
  if(picker){
    if(e.key==='ArrowDown'){ e.preventDefault(); movePicker(1);  return; }
    if(e.key==='ArrowUp')  { e.preventDefault(); movePicker(-1); return; }
    if(e.key==='Enter')    { e.preventDefault(); choosePicker(); return; }
    if(e.key==='Escape')   { e.preventDefault(); closePicker('отменено'); return; }
    if(/^[1-9]$/.test(e.key)){
      const i = +e.key - 1;
      if(i < picker.rows.length){ e.preventDefault(); picker.idx = i; paintPicker(); choosePicker(); return; }
    }
  }

  if(e.key==='Enter'){ e.preventDefault(); if(!S.busy) submit(); return; }
  if(e.key==='Backspace'){ e.preventDefault(); typed = typed.slice(0,-1); sugIdx=0; renderInput(); return; }
  if(e.key==='Escape'){ e.preventDefault(); typed=''; sugIdx=0; renderInput(); return; }
  if(e.key==='Tab'){ e.preventDefault(); acceptGhost(); return; }
  if(e.key==='ArrowRight'){ if(acceptGhost()){ e.preventDefault(); } return; }
  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(sugBox.classList.contains('show')){ sugIdx=(sugIdx+1)%sugList.length; renderInput(); }
    else if(histIdx < history.length-1){ histIdx++; typed=history[histIdx]; renderInput(); }
    else { histIdx = history.length; typed=''; renderInput(); }
    return;
  }
  if(e.key==='ArrowUp'){
    e.preventDefault();
    if(sugBox.classList.contains('show')){ sugIdx=(sugIdx-1+sugList.length)%sugList.length; renderInput(); }
    else if(histIdx > 0){ histIdx--; typed=history[histIdx]; renderInput(); }
    else if(history.length && histIdx===history.length){ histIdx=history.length-1; typed=history[histIdx]; renderInput(); }
    return;
  }
  if(e.key.length === 1){
    e.preventDefault();
    typed += e.key.toLowerCase();
    sugIdx = 0;
    renderInput();
  }
});

// фокус: клик в любом месте возвращает клавиатуру
document.addEventListener('mousedown', e=>{
  if(e.target.closest('.prow,.sug,.chip')) return;
  setTimeout(()=>{ if(!window.getSelection().toString()) hidden.focus({preventScroll:true}); }, 0);
});
hidden.addEventListener('focus', ()=>{ document.body.classList.remove('unfocused'); chips.classList.add('show'); });
hidden.addEventListener('blur',  ()=>{ document.body.classList.add('unfocused'); });
window.addEventListener('load',  ()=>hidden.focus({preventScroll:true}));

/* быстрые команды (выезжающая панель) */
const CHIPS = [
  { t:'connect',    run:'connect' },
  { t:'disconnect', run:'disconnect', cls:'danger' },
  { t:'status',     run:'status' },
  { t:'profiles',   run:'profiles' },
  { t:'help',       run:'help' },
];
chips.innerHTML = CHIPS.map(c=>`<div class="chip ${c.cls||''}" data-run="${c.run}">${c.t}</div>`).join('');
chips.querySelectorAll('.chip').forEach(el=>{
  el.addEventListener('mousedown', e=>{
    e.preventDefault();
    if(S.busy) return;
    typed = el.dataset.run; renderInput(); submit();
  });
});

/* ─────────────────────── commands ─────────────────────── */

function echoCmd(text){
  push(`<span class="p">fox ❯</span> <span class="c">${esc(text)}</span>`, 'cmd');
}

function exec(raw){
  closePicker();
  echoCmd(raw);
  const [head, ...rest] = raw.toLowerCase().split(/\s+/);
  const arg = rest.join(' ');
  const cmd = COMMANDS.find(c => c.n===head || c.al.includes(head));
  if(!cmd){
    const near = COMMANDS.find(c => c.n.startsWith(head[0]||''));
    push(`<span class="err">команда не найдена:</span> ${esc(head)}`+
         (near ? ` <span class="dim">· может быть, <span class="acc">${near.n}</span>?</span>` : ''));
    blank();
    return;
  }
  ({connect:cmdConnect, disconnect:cmdDisconnect, status:cmdStatus,
    profiles:cmdProfiles, route:cmdRoute, help:cmdHelp, clear:cmdClear})[cmd.n](arg);
}

/* help */
function cmdHelp(){
  const rows = COMMANDS.map(c=>
    `<span class="hc">${c.n}${c.a?' <span class="faint">'+c.a+'</span>':''}</span><span class="dim">${c.d}${c.al.length?'  <span class="faint">('+c.al.join(', ')+')</span>':''}</span>`
  ).join('');
  const el = document.createElement('div');
  el.className='help';
  el.innerHTML = rows;
  pushRaw(el);
  push(`<span class="faint">tab — автодополнение · начните печатать, остальное допечатается</span>`);
  blank();
}

/* clear */
function cmdClear(){ log.innerHTML=''; }

/* status */
function cmdStatus(){
  const el = document.createElement('div');
  el.className='kv';
  if(S.mode!=='connected'){
    el.innerHTML =
      `<span class="k">состояние</span><span class="dim">● offline</span>`+
      `<span class="k">профиль</span><span>${S.profile.id} <span class="dim">· ${S.profile.city}</span></span>`+
      `<span class="k">подсказка</span><span class="dim">введите <span class="acc">connect</span></span>`;
  } else {
    el.innerHTML =
      `<span class="k">состояние</span><span class="ok">● connected</span>`+
      `<span class="k">профиль</span><span>${S.profile.id} <span class="dim">· ${S.profile.city} (${S.profile.cc})</span></span>`+
      `<span class="k">интерфейс</span><span>fox0 <span class="dim">· wireguard · ${TUN_IP}/32</span></span>`+
      `<span class="k">внешний ip</span><span>${S.profile.ip}</span>`+
      `<span class="k">задержка</span><span>${S.ping}ms</span>`+
      `<span class="k">аптайм</span><span>${fmtUptime()}</span>`+
      `<span class="k">трафик</span><span>↓ ${fmtBytes(S.rx)} <span class="dim">·</span> ↑ ${fmtBytes(S.tx)}</span>`;
  }
  pushRaw(el); blank();
}

/* route */
function cmdRoute(){
  if(S.mode!=='connected'){
    push(`<span class="dim">туннель не активен — маршрут прямой (без защиты)</span>`);
    push(`<span class="faint">вы · ${LOCAL_IP}  ──▶  internet</span>`);
    blank(); return;
  }
  printRouteBlock(); blank();
}
function printRouteBlock(){
  const p = S.profile;
  const el = document.createElement('div');
  el.className = 'route-log';
  el.innerHTML =
`<span class="dim">вы</span> <span class="white">· ${LOCAL_IP}</span>
 <span class="faint">│</span>
 <span class="faint">│</span>  <span class="acc">fox0</span> <span class="dim">· wireguard · chacha20-poly1305</span>
 <span class="faint">▼</span>
<span class="acc">🦊 ${p.id}</span> <span class="dim">· ${p.city} (${p.cc}) ·</span> <span class="white">${p.ip}</span> <span class="dim">· ${S.ping}ms</span>
 <span class="faint">│</span>
 <span class="faint">▼</span>
<span class="dim">internet</span> <span class="dim">· вас видят как</span> <span class="ok">${p.ip}</span>`;
  pushRaw(el);
}

/* connect */
function resolveProfile(arg){
  if(!arg) return S.profile.id==='auto' ? PROFILES[1] : S.profile;
  const m = profileMatches(arg);
  return m.length ? (m[0].id==='auto' ? PROFILES[1] : m[0]) : null;
}

async function stepAnim(container, label, ms, detail){
  const el = document.createElement('div');
  el.className = 'step';
  el.innerHTML = `<span class="mark warn"></span><span class="dim">${label}</span><span class="ms"></span>`;
  container.appendChild(el);
  log.scrollTop = log.scrollHeight;
  const mark = el.querySelector('.mark');
  const frames = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
  let i = 0;
  const iv = setInterval(()=>{ mark.textContent = frames[i++ % frames.length]; }, 60);
  await sleep(ms);
  clearInterval(iv);
  mark.textContent = '✓'; mark.className = 'mark ok';
  el.querySelector('.ms').textContent = ms + 'ms';
  if(detail){
    const d = el.querySelector('.dim');
    d.innerHTML = label + '  <span class="faint">' + detail + '</span>';
  }
}

async function cmdConnect(arg){
  if(S.busy) return;
  const target = arg ? resolveProfile(arg) : resolveProfile('');
  if(!target){
    push(`<span class="err">профиль не найден:</span> ${esc(arg)} <span class="dim">· см. <span class="acc">profiles</span></span>`);
    blank(); return;
  }
  if(S.mode==='connected' && target.id===S.profile.id){
    push(`<span class="dim">уже подключено к <span class="acc">${target.id}</span></span>`); blank(); return;
  }

  S.busy = true;
  const switching = S.mode==='connected';
  if(switching){
    push(`<span class="dim">переключение ${S.profile.id} → ${target.id}…</span>`);
    S.mode='offline'; renderStatusline(); renderRouteStrip(); repaintFoxes();
    await sleep(300);
  }

  S.profile = target;
  setAccent(PALETTES[target.pal].accent);
  S.mode = 'connecting';
  renderStatusline(); repaintFoxes();

  const wrap = document.createElement('div');
  wrap.className = 'steps-wrap';
  pushRaw(wrap);

  await stepAnim(wrap, `endpoint ${target.id}.foxhole.net`, 140, '→ '+target.ip);
  await stepAnim(wrap, 'handshake noise_ik · x25519', 220);
  await stepAnim(wrap, 'ключи согласованы · chacha20-poly1305', 90);
  await stepAnim(wrap, `интерфейс fox0 поднят`, 160, TUN_IP+'/32');
  await stepAnim(wrap, 'маршруты и dns применены', 120, 'dns 10.8.0.1');

  S.mode = 'connected';
  S.since = Date.now();
  S.ping = target.ping;
  S.rx = 0; S.tx = 0;
  S.busy = false;

  renderStatusline(); renderRouteStrip(); repaintFoxes();

  push(`<span class="ok">✓ подключено</span> <span class="dim">·</span> <span class="acc">${target.id}</span> <span class="dim">· ${target.city} · за 0.7s</span>`);
  blank();
  printRouteBlock();
  blank();
}

/* disconnect */
async function cmdDisconnect(){
  if(S.busy) return;
  if(S.mode!=='connected'){
    push(`<span class="dim">туннель и так не активен</span>`); blank(); return;
  }
  S.busy = true;
  const wrap = document.createElement('div');
  wrap.className='steps-wrap';
  pushRaw(wrap);
  await stepAnim(wrap, 'закрываю туннель fox0', 150);
  await stepAnim(wrap, 'восстанавливаю маршруты и dns', 110);
  const up = fmtUptime(), traffic = `↓ ${fmtBytes(S.rx)} · ↑ ${fmtBytes(S.tx)}`;
  S.mode='offline'; S.busy=false;
  renderStatusline(); renderRouteStrip(); repaintFoxes();
  push(`<span class="dim">● отключено · сессия ${up} · ${traffic} · лиса спит 💤</span>`);
  blank();
}

/* profiles picker */
function cmdProfiles(){
  const el = document.createElement('div');
  el.className='plist';
  const rows = PROFILES.map((p,i)=>{
    const cur = p.id===S.profile.id && S.mode==='connected';
    const sw = PALETTES[p.id==='auto'?'ember':p.pal].accent;
    return `<div class="prow" data-i="${i}">
      <span class="idx">${i+1}</span>
      <span class="swatch" style="background:${sw}"></span>
      <span class="name">${p.id}</span>
      <span class="geo">${p.city}${p.cc!=='—' ? ' · '+p.cc : ''}</span>
      <span class="ping">${p.ping!==null ? p.ping+'ms' : 'auto'}</span>
      <span class="cur">${cur ? '● активен' : ''}</span>
    </div>`;
  }).join('');
  el.innerHTML = rows;
  pushRaw(el);
  push(`<span class="faint">↑↓ выбор · enter подключить · esc отмена · или цифра 1–${PROFILES.length}</span>`);
  blank();

  picker = { el, rows:[...el.querySelectorAll('.prow')], idx: PROFILES.indexOf(S.profile) };
  if(picker.idx<0) picker.idx = 0;
  paintPicker();
  picker.rows.forEach(r=>{
    r.addEventListener('mousedown', e=>{
      e.preventDefault();
      if(!picker || picker.el!==el) return;
      picker.idx = +r.dataset.i; paintPicker(); choosePicker();
    });
  });
}
function paintPicker(){
  if(!picker) return;
  picker.rows.forEach((r,i)=>r.classList.toggle('active', i===picker.idx));
}
function movePicker(d){
  picker.idx = (picker.idx + d + picker.rows.length) % picker.rows.length;
  paintPicker();
  picker.el.scrollIntoView({block:'nearest'});
}
function choosePicker(){
  const p = PROFILES[picker.idx];
  closePicker();
  typed=''; renderInput();
  exec('connect ' + p.id);
}
function closePicker(note){
  if(!picker) return;
  picker.el.classList.add('inert');
  picker.rows.forEach(r=>r.classList.remove('active'));
  picker = null;
  if(note) push(`<span class="faint">${note}</span>`);
}

/* ─────────────────────── welcome ──────────────────────── */

function welcome(){
  const b = document.createElement('div');
  b.className = 'banner';
  b.innerHTML = `
    <canvas width="16" height="16"></canvas>
    <div class="bw">
      <div class="word"><b>FOX</b>HOLE</div>
      <div class="tag">приватный туннель · минимум шума, максимум пользы</div>
      <div class="hint">введите <kbd>help</kbd> · или начните печатать — команда допечатается, <kbd>tab</kbd> подтвердит</div>
    </div>`;
  pushRaw(b);
  registerFox(b.querySelector('canvas'));
  blank();
}

welcome();
renderStatusline();
renderInput();
</script>
