name: release

on:
  push:
    branches:
      - main
    tags:
      - "public_beta_*"
      - "v*.*.*-*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-connected-tests:
    name: release emulator connected and macro gates
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: recursive

      - name: setup android libbox build
        uses: ./.github/actions/setup-android-libbox

      - name: prebuild connected test artifacts
        run: ./gradlew --no-daemon --console=plain --stacktrace assembleDebug assembleDebugAndroidTest :macrobenchmark:assembleAndroidTest

      - name: reclaim disk for emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf \
            "${ANDROID_NDK_HOME:-}" \
            "$HOME/go/pkg/mod" \
            "$HOME/go/pkg/sumdb" \
            "$HOME/.cache/go-build" \
            "$GITHUB_WORKSPACE/third_party/sing-box"
          echo "Disk after cleanup:"
          df -h

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: precreate emulator avd
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          if [[ ! -x "$SDKMANAGER" || ! -x "$AVDMANAGER" ]]; then
            echo "Android command-line tools are missing under $ANDROID_SDK_ROOT" >&2
            exit 1
          fi
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --channel=0 --install "emulator" "platform-tools" "platforms;android-35" "system-images;android-35;default;x86_64"
          echo no | "$AVDMANAGER" create avd --force -n foxhole-release-ci --abi "default/x86_64" --package "system-images;android-35;default;x86_64" --device "pixel_7"
          test -f "$ANDROID_AVD_HOME/foxhole-release-ci.avd/config.ini"
          echo "hw.cpu.ncore=2" >> "$ANDROID_AVD_HOME/foxhole-release-ci.avd/config.ini"

      - name: run release emulator gates
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        env:
          FOXHOLE_EXTRA_CONNECTED_TEST_SPECS: com.foxhole.beta.vpn.TorRuntimeInstallerDeviceTest,com.foxhole.beta.vpn.DnsFilterAssetInstallerDeviceTest,com.foxhole.beta.vpn.VpnRuntimeSmokeTest
          FOXHOLE_LIVE_VPN_SMOKE: 1
          FOXHOLE_REQUIRE_RUNTIME_STRESS: 1
          FOXHOLE_RUNTIME_STRESS_CYCLES: 20
          FOXHOLE_RUNTIME_STRESS_SUBSCRIPTION_URL: ${{ secrets.FOXHOLE_RUNTIME_STRESS_SUBSCRIPTION_URL }}
          FOXHOLE_RUNTIME_STRESS_SUBSCRIPTION_BASE64: ${{ secrets.FOXHOLE_RUNTIME_STRESS_SUBSCRIPTION_BASE64 }}
          FOXHOLE_ALLOW_INSECURE_TLS_FOR_LIVE_SUBSCRIPTION: ${{ secrets.FOXHOLE_ALLOW_INSECURE_TLS_FOR_LIVE_SUBSCRIPTION || '0' }}
          FOXHOLE_REQUIRE_FULL_MACROBENCHMARK: 1
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disk-size: 2048M
          avd-name: foxhole-release-ci
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/run-connected-android-tests.sh
            bash scripts/run-ci-macrobenchmark.sh "${{ github.event_name }}" "${{ github.ref }}"

      - name: upload release connected reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-connected-reports-${{ github.ref_name }}
          path: |
            build/connected-test-specs
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            macrobenchmark/build/reports
            macrobenchmark/build/outputs

  release:
    needs: release-connected-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_RELEASE_CERT_SHA256: fcbf14862040fbe26726f06f3016ec3b027d8431c76cb4c25c13c5a06837177c
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: setup android libbox build
        uses: ./.github/actions/setup-android-libbox

      - name: prepare release signing inputs
        shell: bash
        env:
          FOXHOLE_RELEASE_STORE_FILE_B64: ${{ secrets.FOXHOLE_RELEASE_STORE_FILE_B64 }}
          FOXHOLE_RELEASE_STORE_PASSWORD: ${{ secrets.FOXHOLE_RELEASE_STORE_PASSWORD }}
          FOXHOLE_RELEASE_KEY_ALIAS: ${{ secrets.FOXHOLE_RELEASE_KEY_ALIAS }}
          FOXHOLE_RELEASE_KEY_PASSWORD: ${{ secrets.FOXHOLE_RELEASE_KEY_PASSWORD }}
          FOXHOLE_RELEASE_STORE_TYPE: ${{ secrets.FOXHOLE_RELEASE_STORE_TYPE }}
        run: |
          set -euo pipefail
          missing=()
          for secret_name in \
            FOXHOLE_RELEASE_STORE_FILE_B64 \
            FOXHOLE_RELEASE_STORE_PASSWORD \
            FOXHOLE_RELEASE_KEY_ALIAS \
            FOXHOLE_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("$secret_name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Release signing secrets are required. Missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/foxhole-release.p12"
          if ! printf '%s' "$FOXHOLE_RELEASE_STORE_FILE_B64" | base64 --decode > "$keystore_path"; then
            echo "FOXHOLE_RELEASE_STORE_FILE_B64 is not valid base64" >&2
            exit 1
          fi
          chmod 600 "$keystore_path"
          {
            echo "FOXHOLE_RELEASE_STORE_FILE=$keystore_path"
            echo "FOXHOLE_RELEASE_STORE_PASSWORD=$FOXHOLE_RELEASE_STORE_PASSWORD"
            echo "FOXHOLE_RELEASE_KEY_ALIAS=$FOXHOLE_RELEASE_KEY_ALIAS"
            echo "FOXHOLE_RELEASE_KEY_PASSWORD=$FOXHOLE_RELEASE_KEY_PASSWORD"
            echo "FOXHOLE_RELEASE_STORE_TYPE=${FOXHOLE_RELEASE_STORE_TYPE:-PKCS12}"
          } >> "$GITHUB_ENV"

      - name: release quality gates
        run: ./gradlew --no-daemon --console=plain --stacktrace detekt verifyDetektBaseline lintDebug lintRelease lintVitalRelease testDebugUnitTest jacocoDebugUnitTestReport jacocoDebugUnitTestCoverageVerification verifyReleaseBuildConfigDefaults

      - name: mandatory dependency vulnerability scan
        run: scripts/run-osv-source-scan.sh

      - name: build release
        run: ./gradlew --no-daemon --console=plain --stacktrace -Pfoxhole.splitApks=true validateSigningRelease assembleRelease verifyReleaseBuildConfigDefaults

      - name: verify AdGuard DNS assets in release APKs
        run: scripts/verify-adguard-dns-assets.sh app/build/outputs/apk/release/*.apk

      - name: generate sbom
        run: ./gradlew --no-daemon --console=plain --stacktrace cyclonedxBom -Pfoxhole.sbom=true

      - name: verify signed release APKs
        id: release_apk
        shell: bash
        run: |
          set -euo pipefail
          apks=()
          while IFS= read -r apk; do
            apks+=("$apk")
          done < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 3 ]]; then
            printf 'Expected exactly three release APKs, found %s:\n' "${#apks[@]}" >&2
            if [[ "${#apks[@]}" -gt 0 ]]; then
              printf ' - %s\n' "${apks[@]}" >&2
            fi
            exit 1
          fi

          for required_pattern in '*arm64-v8a*.apk' '*armeabi-v7a*.apk' '*universal*.apk'; do
            matches=(app/build/outputs/apk/release/$required_pattern)
            if [[ "${#matches[@]}" -ne 1 || ! -f "${matches[0]}" ]]; then
              echo "Expected exactly one release APK matching $required_pattern" >&2
              printf 'Found APKs:\n' >&2
              printf ' - %s\n' "${apks[@]}" >&2
              exit 1
            fi
          done

          apksigner="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          if [[ ! -x "$apksigner" ]]; then
            apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          fi
          if [[ -z "${apksigner:-}" || ! -x "$apksigner" ]]; then
            echo "apksigner not found under $ANDROID_SDK_ROOT/build-tools" >&2
            exit 1
          fi

          expected_cert_sha256="$(printf '%s' "$EXPECTED_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          asset_dir="$RUNNER_TEMP/release-apks"
          mkdir -p "$asset_dir"
          cert_report="$asset_dir/release-certs.txt"
          : > "$cert_report"
          for apk_path in "${apks[@]}"; do
            apk_name="$(basename "$apk_path")"
            if [[ "$apk_name" == *unsigned* ]]; then
              echo "Refusing to publish unsigned release output: $apk_name" >&2
              exit 1
            fi
            current_cert_report="$RUNNER_TEMP/${apk_name}.certs.txt"
            "$apksigner" verify --print-certs "$apk_path" | tee "$current_cert_report"
            cat "$current_cert_report" >> "$cert_report"
            actual_cert_sha256="$(
              awk -F': ' '/certificate SHA-256 digest/ { print $NF; exit }' "$current_cert_report" |
                tr -d ':' |
                tr '[:upper:]' '[:lower:]'
            )"
            if [[ -z "$actual_cert_sha256" ]]; then
              echo "Could not read signing certificate SHA-256 digest from apksigner output for $apk_name" >&2
              exit 1
            fi
            if [[ "$actual_cert_sha256" != "$expected_cert_sha256" ]]; then
              echo "Release signing certificate mismatch for $apk_name" >&2
              echo "Expected: $expected_cert_sha256" >&2
              echo "Actual:   $actual_cert_sha256" >&2
              exit 1
            fi
            case "$apk_name" in
              *arm64-v8a*) asset_name="Foxhole-${GITHUB_REF_NAME}-arm64-v8a-release.apk" ;;
              *armeabi-v7a*) asset_name="Foxhole-${GITHUB_REF_NAME}-armeabi-v7a-release.apk" ;;
              *universal*) asset_name="Foxhole-${GITHUB_REF_NAME}-universal-release.apk" ;;
              *)
                echo "Unexpected release APK name: $apk_name" >&2
                exit 1
                ;;
            esac
            cp "$apk_path" "$asset_dir/$asset_name"
          done
          sbom_path="$(find build/reports -type f -name '*.json' | sort | head -n 1)"
          if [[ -n "$sbom_path" && -f "$sbom_path" ]]; then
            cp "$sbom_path" "$asset_dir/Foxhole-${GITHUB_REF_NAME}-sbom.cdx.json"
          else
            echo "CycloneDX SBOM JSON was not generated under build/reports" >&2
            exit 1
          fi
          (
            cd "$asset_dir"
            sha256sum Foxhole-${GITHUB_REF_NAME}-*.apk Foxhole-${GITHUB_REF_NAME}-sbom.cdx.json release-certs.txt > SHA256SUMS
          )
          echo "Release APK SHA-256 sums:"
          cat "$asset_dir/SHA256SUMS"
          echo "Signing cert SHA-256: $expected_cert_sha256"
          {
            echo "asset_dir=$asset_dir"
            echo "sha256sums_path=$asset_dir/SHA256SUMS"
            echo "cert_sha256=$expected_cert_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-apks-${{ github.ref_name }}
          path: |
            ${{ steps.release_apk.outputs.asset_dir }}/*

      - name: attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ steps.release_apk.outputs.asset_dir }}/*

      - name: publish github release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_dir="${{ steps.release_apk.outputs.asset_dir }}"
          assets=("$asset_dir"/*.apk "$asset_dir"/*.cdx.json "$asset_dir/SHA256SUMS" "$asset_dir/release-certs.txt")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' |
              while IFS= read -r asset_name; do
                case "$asset_name" in
                  "Foxhole-${GITHUB_REF_NAME}-"*.apk|"Foxhole-${GITHUB_REF_NAME}-"*.cdx.json|SHA256SUMS|release-certs.txt)
                    gh release delete-asset "$GITHUB_REF_NAME" "$asset_name" --yes
                  ;;
                esac
              done
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
