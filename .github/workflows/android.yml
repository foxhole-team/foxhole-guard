name: android

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    paths:
      - ".github/**"
      - "app/**"
      - "config/**"
      - "core/**"
      - "gradle/**"
      - "scripts/**"
      - "third_party/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build/unit/security verified
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # FOXCORE_READ_TOKEN is optional: the FoxCore repository is public, anonymous
      # checkout works, and forks without secrets must still be able to build.
      - name: setup Android and FoxCore build
        uses: ./.github/actions/setup-foxcore
        with:
          core-repository: ${{ vars.FOXCORE_REPO || 'foxhole-team/foxhole-guard-rust-core' }}
          core-token: ${{ secrets.FOXCORE_READ_TOKEN }}

      - name: verify wrapper
        run: ./gradlew --no-daemon --console=plain --version

      - name: static analysis, lint, unit tests, and coverage
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:detekt verifyDetektBaseline :app:lintDebug :app:lintRelease :app:lintVitalRelease :app:testDebugUnitTest jacocoDebugUnitTestReport jacocoDebugUnitTestCoverageVerification verifyReleaseBuildConfigDefaults

      - name: build debug APK
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug

      - name: verify AdGuard DNS assets in debug APK
        run: scripts/verify-adguard-dns-assets.sh app/build/outputs/apk/debug/*.apk

      - name: secret scan
        run: scripts/run-gitleaks-scan.sh

      - name: mandatory dependency vulnerability scan
        run: scripts/run-osv-source-scan.sh

      - name: upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-reports
          path: |
            app/build/reports
            app/build/test-results
            build/reports
