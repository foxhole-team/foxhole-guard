name: android

on:
  push:
    branches:
      - main
      - dev
      - "codex/**"
  pull_request:
    paths:
      - ".github/**"
      - "app/**"
      - "gradle/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "macrobenchmark/**"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build/unit/security verified
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: recursive

      - name: setup android libbox build
        uses: ./.github/actions/setup-android-libbox

      - name: verify wrapper
        run: ./gradlew --no-daemon --console=plain --version

      - name: static analysis, release lint gate, unit tests, and coverage
        run: ./gradlew --no-daemon --console=plain --stacktrace detekt lintDebug lintRelease lintVitalRelease testDebugUnitTest jacocoDebugUnitTestReport jacocoDebugUnitTestCoverageVerification

      - name: build connected and benchmark test artifacts
        run: ./gradlew --no-daemon --console=plain --stacktrace assembleDebug assembleDebugAndroidTest :macrobenchmark:assembleAndroidTest

      - name: build release
        run: ./gradlew --no-daemon --console=plain --stacktrace -Pfoxhole.splitApks=true assembleRelease

      - name: verify AdGuard DNS assets in app builds
        run: scripts/verify-adguard-dns-assets.sh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: generate sbom
        run: ./gradlew --no-daemon --console=plain --stacktrace cyclonedxBom

      - name: secret scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          "$(go env GOPATH)/bin/gitleaks" dir . -c .gitleaks.toml --redact --no-banner

      - name: mandatory dependency vulnerability scan
        run: scripts/run-osv-source-scan.sh

      - name: upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-reports
          path: |
            app/build/reports
            app/build/test-results
            macrobenchmark/build/reports
            macrobenchmark/build/outputs
            build/reports

  connected-tests:
    name: emulator UI/regression connected tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: recursive

      - name: setup android libbox build
        uses: ./.github/actions/setup-android-libbox

      - name: prebuild connected test artifacts
        run: ./gradlew --no-daemon --console=plain --stacktrace assembleDebug assembleDebugAndroidTest

      - name: reclaim disk for emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h
          du -sh \
            "${ANDROID_NDK_HOME:-}" \
            "$HOME/go/pkg/mod" \
            "$HOME/go/pkg/sumdb" \
            "$HOME/.cache/go-build" \
            "$GITHUB_WORKSPACE/third_party/sing-box" 2>/dev/null || true
          sudo rm -rf \
            "${ANDROID_NDK_HOME:-}" \
            "$HOME/go/pkg/mod" \
            "$HOME/go/pkg/sumdb" \
            "$HOME/.cache/go-build" \
            "$GITHUB_WORKSPACE/third_party/sing-box"
          echo "Disk after cleanup:"
          df -h

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: precreate emulator avd
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          if [[ ! -x "$SDKMANAGER" || ! -x "$AVDMANAGER" ]]; then
            echo "Android command-line tools are missing under $ANDROID_SDK_ROOT" >&2
            exit 1
          fi
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --channel=0 --install "emulator" "platform-tools" "platforms;android-35" "system-images;android-35;default;x86_64"
          echo no | "$AVDMANAGER" create avd --force -n foxhole-ci --abi "default/x86_64" --package "system-images;android-35;default;x86_64" --device "pixel_7"
          test -f "$ANDROID_AVD_HOME/foxhole-ci.avd/config.ini"
          echo "hw.cpu.ncore=2" >> "$ANDROID_AVD_HOME/foxhole-ci.avd/config.ini"

      - name: run emulator tests
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        env:
          FOXHOLE_REQUIRED_CONNECTED_TEST_SPECS: ${{ github.event_name == 'pull_request' && 'com.foxhole.beta.ui.HomeScreenTest#opensSettingsFromBottomNavigation,com.foxhole.beta.ui.HomeScreenTest#opensProfilesFromHomeAction,com.foxhole.beta.ui.LiveLogsDialogTest' || '' }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disk-size: 2048M
          avd-name: foxhole-ci
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/run-connected-android-tests.sh
            bash scripts/run-ci-macrobenchmark.sh "${{ github.event_name }}" "${{ github.ref }}"

      - name: validate connected test xml
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          roots = [
              pathlib.Path("build/connected-test-specs"),
              pathlib.Path("app/build/outputs/androidTest-results"),
          ]
          xml_paths = []
          for root in roots:
              if root.exists():
                  xml_paths.extend(root.rglob("TEST-*.xml"))
          if not xml_paths:
              sys.exit("No connected-test JUnit XML files were generated")

          all_skipped = []
          for path in sorted(set(xml_paths)):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as error:
                  sys.exit(f"Could not parse {path}: {error}")
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              for suite in suites:
                  tests = int(float(suite.attrib.get("tests", "0") or 0))
                  skipped = int(float(suite.attrib.get("skipped", "0") or 0))
                  if tests > 0 and skipped == tests:
                      all_skipped.append(f"{path}: {suite.attrib.get('name', 'unknown')} tests={tests} skipped={skipped}")
          if all_skipped:
              print("Connected test XML contains suites that were discovered but not executed:")
              for item in all_skipped:
                  print(f"- {item}")
              sys.exit(1)
          PY

      - name: upload connected test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: connected-android-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/connected_android_test_additional_output
            macrobenchmark/build/reports
            macrobenchmark/build/outputs
            build/connected-test-specs
