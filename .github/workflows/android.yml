name: android

on:
  push:
    branches:
      - main
      - dev
      - "codex/**"
  pull_request:
    paths:
      - ".github/**"
      - "app/**"
      - "gradle/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "macrobenchmark/**"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build/unit/security verified
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: recursive

      - name: setup android libbox build
        uses: ./.github/actions/setup-android-libbox

      - name: verify wrapper
        run: ./gradlew --no-daemon --console=plain --version

      - name: static analysis, lint, unit tests, and coverage
        run: ./gradlew --no-daemon --console=plain --stacktrace detekt lintDebug lintRelease testDebugUnitTest jacocoDebugUnitTestReport jacocoDebugUnitTestCoverageVerification

      - name: build connected and benchmark test artifacts
        run: ./gradlew --no-daemon --console=plain --stacktrace assembleDebug assembleDebugAndroidTest :macrobenchmark:assembleAndroidTest

      - name: build release
        run: ./gradlew --no-daemon --console=plain --stacktrace -Pfoxhole.splitApks=true assembleRelease

      - name: generate sbom
        run: ./gradlew --no-daemon --console=plain --stacktrace cyclonedxBom

      - name: secret scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          "$(go env GOPATH)/bin/gitleaks" dir . -c .gitleaks.toml --redact --no-banner

      - name: dependency vulnerability scan
        run: |
          mkdir -p build/reports/security
          OSV_VERSION="v2.3.5"
          OSV_ASSET="osv-scanner_linux_amd64"
          curl -fsSL -o "$RUNNER_TEMP/$OSV_ASSET" "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/$OSV_ASSET"
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner_SHA256SUMS" "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_SHA256SUMS"
          (
            cd "$RUNNER_TEMP"
            grep "  $OSV_ASSET\$" osv-scanner_SHA256SUMS | sha256sum -c -
          )
          chmod +x "$RUNNER_TEMP/$OSV_ASSET"
          set +e
          "$RUNNER_TEMP/$OSV_ASSET" scan source -r . \
            --experimental-exclude app/build \
            --experimental-exclude build \
            --experimental-exclude output \
            --experimental-exclude artifacts \
            --experimental-exclude .tmp \
            --experimental-exclude third_party/sing-box \
            --format json \
            --output-file build/reports/security/osv-source.json
          scanner_status=$?
          echo "osv-scanner exit code: $scanner_status"
          set -e
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          report_path = pathlib.Path("build/reports/security/osv-source.json")
          if not report_path.exists():
              sys.exit("OSV report was not generated")
          data = json.loads(report_path.read_text())
          runtime_findings = []
          build_metadata_findings = []
          for result in data.get("results", []):
              source_path = result.get("source", {}).get("path", "")
              for package in result.get("packages", []):
                  vulnerabilities = package.get("vulnerabilities", [])
                  if not vulnerabilities:
                      continue
                  package_name = package.get("package", {}).get("name", "unknown")
                  ids = ",".join(vulnerability.get("id", "unknown") for vulnerability in vulnerabilities)
                  finding = f"{source_path}: {package_name} [{ids}]"
                  if source_path.endswith("gradle/verification-metadata.xml"):
                      build_metadata_findings.append(finding)
                  else:
                      runtime_findings.append(finding)
          if build_metadata_findings:
              print("Known build-tool metadata OSV findings:")
              for finding in build_metadata_findings:
                  print(f"- {finding}")
          if runtime_findings:
              print("Runtime/source dependency OSV findings:")
              for finding in runtime_findings:
                  print(f"- {finding}")
              sys.exit(1)
          PY

      - name: upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-reports
          path: |
            app/build/reports
            app/build/test-results
            macrobenchmark/build/reports
            macrobenchmark/build/outputs
            build/reports

  connected-tests:
    name: emulator UI/regression connected tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: recursive

      - name: setup android libbox build
        uses: ./.github/actions/setup-android-libbox

