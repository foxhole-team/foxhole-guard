[versions]
compose-bom = "2026.08.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
room = "2.8.4"
work = "2.11.2"
webkit = "1.17.0"
glance = "1.1.1"
datastore = "1.2.1"
security-crypto = "1.1.0"
sqlcipher = "4.18.0"
biometric = "1.1.0"
# 5.2.0 is the first release whose bundled libsodium.so is built with 16 KB-aligned LOAD
# segments; 5.1.0 shipped 4 KB alignment and failed Android's 16 KB page-size check.
lazysodium = "5.2.0"
jna = "5.19.1"
serialization = "1.11.0"
coroutines = "1.11.0"
okhttp = "5.5.0"
junit4 = "4.13.2"
konsist = "0.17.3"
androidx-junit = "1.3.0"
espresso = "3.7.0"
test-core = "1.7.0"
benchmark = "1.4.1"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
detekt = "1.23.8"
errorprone = "2.50.0"
zxing-embedded = "4.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.19.0" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
