[versions]
agp = "9.2.1"
kotlin = "2.4.0"
ksp = "2.3.9"
compose-bom = "2026.05.01"
activity-compose = "1.13.0"
lifecycle = "2.10.0"
navigation = "2.9.8"
room = "2.8.4"
work = "2.11.2"
datastore = "1.2.1"
security-crypto = "1.1.0"
sqlcipher = "4.16.0"
serialization = "1.11.0"
coroutines = "1.11.0"
okhttp = "5.4.0"
junit4 = "4.13.2"
androidx-junit = "1.3.0"
espresso = "3.7.0"
test-core = "1.7.0"
benchmark = "1.4.1"
profileinstaller = "1.4.1"
